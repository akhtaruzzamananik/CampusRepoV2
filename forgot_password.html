<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Campus Repo</title>
    <meta name="description" content="Reset your Campus Repo password.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f8f7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: white;
            border-radius: 24px;
            padding: 45px 40px;
            box-shadow: 0 15px 40px rgba(75, 60, 150, 0.12);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: #171717;
            margin-bottom: 35px;
        }

        .logo-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: linear-gradient(135deg, #4d1df2, #663cff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .lock-icon {
            width: 64px;
            height: 64px;
            background: #f0edff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 30px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            color: #111;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .demo-notice {
            background: #fff8e5;
            border: 1px solid #ffeeba;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 12px;
            color: #856404;
            margin-bottom: 22px;
            line-height: 1.5;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #d9d9d9;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            color: #222;
        }

        input:focus {
            border-color: #5425f5;
            box-shadow: 0 0 0 3px rgba(84, 37, 245, 0.08);
        }

        .submit-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #5425f5;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: #4520d4;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }

        .message.success {
            background: #e5f8ef;
            color: #0a7c3e;
            border: 1px solid #b2e8ce;
            display: block;
        }

        .message.error {
            background: #fff0f0;
            color: #dc3545;
            border: 1px solid #fecdd3;
            display: block;
        }

        .back-link {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
        }

        .back-link a {
            color: #5425f5;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .container {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="logo-icon">??</div>
        <span>Campus Repo</span>
    </div>

    <div class="lock-icon">??</div>

    <h1>Forgot Password?</h1>

    <p class="subtitle">
        Enter your email address and we'll send you a reset code.
    </p>

    <div class="demo-notice">
        <strong>? Demo Mode:</strong> No real email is sent.
        You'll be redirected to the reset page with demo code <strong>123456</strong>.
    </div>

    <div class="message" id="message"></div>

    <form id="forgotForm">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
            Send Reset Code
        </button>
    </form>

    <div class="back-link">
        <a href="index.html">? Back to Login</a>
    </div>

</div>


<script src="js/routes.js"></script>
<script src="js/data-store.js"></script>
<script src="js/auth.js"></script>
    <script src="js/guest-preferences.js"></script>

<script>

    const form = document.getElementById('forgotForm');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    function showMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = 'message ' + type;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();

        if (!email) {
            showMessage('Please enter your email address.', 'error');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';

        const result = await AuthService.requestPasswordReset(email);

        if (result.success) {
            showMessage(result.message, 'success');
            setTimeout(() => {
                window.location.href = ROUTES.resetPassword + '?email=' + encodeURIComponent(email);
            }, 2000);
        } else {
            showMessage(result.message, 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send Reset Code';
        }
    });

</script>

</body>
</html>
