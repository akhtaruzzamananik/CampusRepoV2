<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - StudyNest</title>
    <meta name="description" content="Reset your StudyNest password with the verification code.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f8f7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: white;
            border-radius: 24px;
            padding: 45px 40px;
            box-shadow: 0 15px 40px rgba(75, 60, 150, 0.12);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: #171717;
            margin-bottom: 35px;
        }

        .logo-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: linear-gradient(135deg, #4d1df2, #663cff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .lock-icon {
            width: 64px;
            height: 64px;
            background: #f0edff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 30px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            color: #111;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .demo-notice {
            background: #fff8e5;
            border: 1px solid #ffeeba;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 12px;
            color: #856404;
            margin-bottom: 22px;
            line-height: 1.5;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #d9d9d9;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            color: #222;
        }

        input:focus {
            border-color: #5425f5;
            box-shadow: 0 0 0 3px rgba(84, 37, 245, 0.08);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            cursor: pointer;
            color: #777;
            font-size: 14px;
        }

        .submit-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #5425f5;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: #4520d4;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }

        .message.success {
            background: #e5f8ef;
            color: #0a7c3e;
            border: 1px solid #b2e8ce;
            display: block;
        }

        .message.error {
            background: #fff0f0;
            color: #dc3545;
            border: 1px solid #fecdd3;
            display: block;
        }

        .error-text {
            display: none;
            color: #e5484d;
            font-size: 12px;
            margin-top: 5px;
        }

        .back-link {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
        }

        .back-link a {
            color: #5425f5;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .container {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="logo-icon">??</div>
        <span>StudyNest</span>
    </div>

    <div class="lock-icon">??</div>

    <h1>Reset Password</h1>

    <p class="subtitle">
        Enter the verification code and your new password.
    </p>

    <div class="demo-notice">
        <strong>? Demo Mode:</strong> Use code <strong>123456</strong> to reset.
    </div>

    <div class="message" id="message"></div>

    <form id="resetForm">

        <div class="form-group">
            <label for="code">Verification Code</label>
            <input type="text" id="code" placeholder="Enter 6-digit code"
                   maxlength="6" inputmode="numeric" required>
        </div>

        <div class="form-group">
            <label for="newPassword">New Password</label>
            <div class="password-wrapper">
                <input type="password" id="newPassword"
                       placeholder="Enter new password" required minlength="6" autocomplete="current-password">
                <button type="button" class="toggle-password"
                        onclick="togglePw('newPassword', this)">??</button>
            </div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <div class="password-wrapper">
                <input type="password" id="confirmPassword"
                       placeholder="Confirm new password" required autocomplete="current-password">
                <button type="button" class="toggle-password"
                        onclick="togglePw('confirmPassword', this)">??</button>
            </div>
            <div class="error-text" id="passwordError">Passwords do not match.</div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
            Reset Password
        </button>
    </form>

    <div class="back-link">
        <a href="index.html">? Back to Login</a>
    </div>

</div>


<script src="js/routes.js"></script>
<script src="js/data-store.js"></script>
<script src="js/auth.js"></script>
    <script src="js/guest-preferences.js"></script>

<script>

    function togglePw(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = '??';
        } else {
            input.type = 'password';
            btn.textContent = '??';
        }
    }

    // Get email from query params
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email') || '';

    const form = document.getElementById('resetForm');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');
    const passwordError = document.getElementById('passwordError');

    function showMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = 'message ' + type;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const code = document.getElementById('code').value.trim();
        const newPw = document.getElementById('newPassword').value;
        const confirmPw = document.getElementById('confirmPassword').value;

        passwordError.style.display = 'none';

        if (newPw !== confirmPw) {
            passwordError.style.display = 'block';
            return;
        }

        if (code.length !== 6) {
            showMessage('Please enter the 6-digit verification code.', 'error');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Resetting...';

        const result = await AuthService.resetPassword(email, code, newPw);

        if (result.success) {
            showMessage('Password reset successful! Redirecting to login...', 'success');
            setTimeout(() => {
                window.location.href = ROUTES.login;
            }, 2000);
        } else {
            showMessage(result.message, 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Reset Password';
        }
    });

</script>

</body>
</html>
